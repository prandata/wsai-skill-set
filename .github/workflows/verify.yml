name: verify tricks
on:
  schedule: [{cron: "0 19 * * *"}]   # 06:00 Sydney
  workflow_dispatch:
permissions: {contents: write}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml && python3 scripts/verify.py
      - run: python3 scripts/build_newsletter.py > newsletter/full-list.md
      - run: |
          git config user.name "skill-set-bot"; git config user.email "skill-set-bot@users.noreply.github.com"
          git add tricks.yaml newsletter/full-list.md
          git diff --cached --quiet || git commit -m "verify: daily link check" && git push
